workflows:
  dental-signal-ios:
    name: Dental Signal iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dentalsignal.app
      node: 18.17.0
      groups:
        - ios-signing
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App

    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Add iOS platform
        script: npx cap add ios

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Install CocoaPods
        script: cd ios/App && pod install

      - name: Add Privacy Manifest
        script: |
          cat > ios/App/App/PrivacyInfo.xcprivacy << 'PRIVACY_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>NSPrivacyAccessedAPITypes</key>
              <array>
                  <dict>
                      <key>NSPrivacyAccessedAPIType</key>
                      <string>NSPrivacyAccessedAPICategoryUserDefaults</string>
                      <key>NSPrivacyAccessedAPITypeReasons</key>
                      <array>
                          <string>CA92.1</string>
                      </array>
                  </dict>
              </array>
              <key>NSPrivacyCollectedDataTypes</key>
              <array/>
              <key>NSPrivacyTracking</key>
              <false/>
              <key>NSPrivacyTrackingDomains</key>
              <array/>
          </dict>
          </plist>
          PRIVACY_EOF
          ruby << 'RUBY_EOF'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.first
          group = project.main_group['App']
          unless group.files.any? { |f| f.path == 'PrivacyInfo.xcprivacy' }
            file_ref = group.new_file('PrivacyInfo.xcprivacy')
            target.resources_build_phase.add_file_reference(file_ref)
          end
          project.save
          puts 'PrivacyInfo.xcprivacy added to Xcode project'
          RUBY_EOF

      - name: Set build number, privacy strings and export compliance
        script: |
          PLIST="ios/App/App/Info.plist"
          # Build number
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          # Export compliance
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          # Camera — required for photo upload feature
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Used to take a profile photo for staff members'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Used to take a profile photo for staff members'" "$PLIST"
          # Photo library — required for picking profile photos
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Used to select a profile photo for staff members'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Used to select a profile photo for staff members'" "$PLIST"
          # Microphone — required by WKWebView even if not used
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Required by the app framework'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'Required by the app framework'" "$PLIST"

      - name: Set up code signing profiles
        script: xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist export_options.plist

      - name: Publish to TestFlight
        script: |
          python3 << 'PYEOF'
          import os, re
          key = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '')
          # Strip existing headers and all whitespace, get raw base64
          body = re.sub(r'-----[^-]+-----', '', key)
          body = re.sub(r'\s+', '', body)
          # Rebuild proper PEM with 64-char line wrapping
          lines = [body[i:i+64] for i in range(0, len(body), 64)]
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(lines) + '\n-----END PRIVATE KEY-----\n'
          with open('/tmp/asc_key.p8', 'w') as f:
              f.write(pem)
          print(f'Key written: {len(body)} base64 chars, {len(lines)} lines')
          PYEOF
          app-store-connect publish \
            --path build/ios/ipa/*.ipa \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @file:/tmp/asc_key.p8

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
