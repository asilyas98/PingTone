workflows:
  dental-signal-ios:
    name: Dental Signal iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dentalsignal.app
      node: 18.17.0
      groups:
        - ios-signing
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App

    scripts:
      - name: Install npm dependencies
        # Delete lock file so npm resolves latest ^5.x versions of Capacitor
        script: |
          rm -f package-lock.json
          npm install

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Add iOS platform
        script: npx cap add ios

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Inject app icon
        script: |
          pip3 install Pillow --break-system-packages --quiet
          python3 << 'PYEOF'
          from PIL import Image
          import json, os, shutil

          src = 'ios-icons/icon-1024.png'
          icon_dir = 'ios/App/App/Assets.xcassets/AppIcon.appiconset'
          os.makedirs(icon_dir, exist_ok=True)

          base = Image.open(src)

          specs = [
              ('icon-20@2x.png',   40),
              ('icon-20@3x.png',   60),
              ('icon-29@1x.png',   29),
              ('icon-29@2x.png',   58),
              ('icon-29@3x.png',   87),
              ('icon-40@2x.png',   80),
              ('icon-40@3x.png',  120),
              ('icon-60@2x.png',  120),
              ('icon-60@3x.png',  180),
              ('icon-76@1x.png',   76),
              ('icon-76@2x.png',  152),
              ('icon-83.5@2x.png',167),
              ('icon-1024.png',  1024),
          ]

          for fname, size in specs:
              base.resize((size, size), Image.LANCZOS).save(f'{icon_dir}/{fname}')

          contents = {
            "images": [
              {"idiom":"iphone","scale":"2x","size":"20x20","filename":"icon-20@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"20x20","filename":"icon-20@3x.png"},
              {"idiom":"iphone","scale":"1x","size":"29x29","filename":"icon-29@1x.png"},
              {"idiom":"iphone","scale":"2x","size":"29x29","filename":"icon-29@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"29x29","filename":"icon-29@3x.png"},
              {"idiom":"iphone","scale":"2x","size":"40x40","filename":"icon-40@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"40x40","filename":"icon-40@3x.png"},
              {"idiom":"iphone","scale":"2x","size":"60x60","filename":"icon-60@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"60x60","filename":"icon-60@3x.png"},
              {"idiom":"ipad","scale":"1x","size":"20x20","filename":"icon-20@2x.png"},
              {"idiom":"ipad","scale":"2x","size":"20x20","filename":"icon-40@2x.png"},
              {"idiom":"ipad","scale":"1x","size":"29x29","filename":"icon-29@1x.png"},
              {"idiom":"ipad","scale":"2x","size":"29x29","filename":"icon-29@2x.png"},
              {"idiom":"ipad","scale":"1x","size":"40x40","filename":"icon-40@2x.png"},
              {"idiom":"ipad","scale":"2x","size":"40x40","filename":"icon-40@3x.png"},
              {"idiom":"ipad","scale":"1x","size":"76x76","filename":"icon-76@1x.png"},
              {"idiom":"ipad","scale":"2x","size":"76x76","filename":"icon-76@2x.png"},
              {"idiom":"ipad","scale":"2x","size":"83.5x83.5","filename":"icon-83.5@2x.png"},
              {"idiom":"ios-marketing","scale":"1x","size":"1024x1024","filename":"icon-1024.png"}
            ],
            "info": {"author":"xcode","version":1}
          }
          with open(f'{icon_dir}/Contents.json', 'w') as f:
              json.dump(contents, f, indent=2)

          print(f'Icons injected into {icon_dir}')
          PYEOF

      - name: Patch Podfile with framework privacy manifest hook
        script: |
          # Capacitor's Podfile already has a post_install block.
          # We inject our code INTO that existing block (CocoaPods forbids two hooks).
          python3 << 'PYEOF'
          with open('ios/App/Podfile', 'r') as f:
              content = f.read()

          injection = '\n'.join([
              '  # --- Injected: write PrivacyInfo.xcprivacy into framework pods (fixes ITMS-91061)',
              '  require "fileutils"',
              '  _priv_xml  = "<?xml version=\\"1.0\\" encoding=\\"UTF-8\\"?>\\n"',
              '  _priv_xml += "<!DOCTYPE plist PUBLIC \\"-//Apple//DTD PLIST 1.0//EN\\"'
                              ' \\"http://www.apple.com/DTDs/PropertyList-1.0.dtd\\">\\n"',
              '  _priv_xml += "<plist version=\\"1.0\\">\\n<dict>\\n"',
              '  _priv_xml += "  <key>NSPrivacyAccessedAPITypes</key>\\n  <array>\\n    <dict>\\n"',
              '  _priv_xml += "    <key>NSPrivacyAccessedAPIType</key>\\n"',
              '  _priv_xml += "    <string>NSPrivacyAccessedAPICategoryUserDefaults</string>\\n"',
              '  _priv_xml += "    <key>NSPrivacyAccessedAPITypeReasons</key>\\n"',
              '  _priv_xml += "    <array>\\n      <string>CA92.1</string>\\n    </array>\\n"',
              '  _priv_xml += "  </dict>\\n  </array>\\n"',
              '  _priv_xml += "  <key>NSPrivacyCollectedDataTypes</key>\\n  <array/>\\n"',
              '  _priv_xml += "  <key>NSPrivacyTracking</key>\\n  <false/>\\n"',
              '  _priv_xml += "  <key>NSPrivacyTrackingDomains</key>\\n  <array/>\\n"',
              '  _priv_xml += "</dict>\\n</plist>\\n"',
              '  ["Capacitor", "CordovaPlugins"].each do |_pod_name|',
              '    _target = installer.pods_project.targets.find { |t| t.name == _pod_name }',
              '    next unless _target',
              '    _pod_dir = installer.sandbox.pod_dir(_pod_name).to_s',
              '    FileUtils.mkdir_p(_pod_dir)',
              '    _privacy_path = File.join(_pod_dir, "PrivacyInfo.xcprivacy")',
              '    File.write(_privacy_path, _priv_xml)',
              '    puts "Written: #{_privacy_path}"',
              '    _refs = _target.resources_build_phase.files_references',
              '    unless _refs.any? { |f| f.path.to_s.include?("PrivacyInfo") }',
              '      _file_ref = installer.pods_project.new_file(_privacy_path)',
              '      _target.resources_build_phase.add_file_reference(_file_ref)',
              '      puts "Registered in #{_pod_name} resources build phase"',
              '    end',
              '  end',
              '  installer.pods_project.save',
              '  # --- End injection',
          ]) + '\n'

          # Inject right after the opening line of the existing post_install block
          marker = 'post_install do |installer|'
          if marker in content:
              content = content.replace(marker, marker + '\n' + injection, 1)
              with open('ios/App/Podfile', 'w') as f:
                  f.write(content)
              print('Injected into existing post_install block')
          else:
              # No existing block — append one (fallback)
              with open('ios/App/Podfile', 'a') as f:
                  f.write('\npost_install do |installer|\n' + injection + 'end\n')
              print('Appended new post_install block (no existing one found)')
          PYEOF

      - name: Install CocoaPods
        script: cd ios/App && pod install

      - name: Add app-level Privacy Manifest
        script: |
          # Writes PrivacyInfo.xcprivacy for the app target itself (NSUserDefaults via WKWebView)
          python3 << 'PYEOF'
          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
              '<plist version="1.0">',
              '<dict>',
              '    <key>NSPrivacyAccessedAPITypes</key>',
              '    <array>',
              '        <dict>',
              '            <key>NSPrivacyAccessedAPIType</key>',
              '            <string>NSPrivacyAccessedAPICategoryUserDefaults</string>',
              '            <key>NSPrivacyAccessedAPITypeReasons</key>',
              '            <array>',
              '                <string>CA92.1</string>',
              '            </array>',
              '        </dict>',
              '    </array>',
              '    <key>NSPrivacyCollectedDataTypes</key>',
              '    <array/>',
              '    <key>NSPrivacyTracking</key>',
              '    <false/>',
              '    <key>NSPrivacyTrackingDomains</key>',
              '    <array/>',
              '</dict>',
              '</plist>',
          ]
          with open('ios/App/App/PrivacyInfo.xcprivacy', 'w') as f:
              f.write('\n'.join(lines) + '\n')
          print('App PrivacyInfo.xcprivacy written')
          PYEOF
          ruby << 'RUBY_EOF'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.first
          group = project.main_group['App']
          unless group.files.any? { |f| f.path == 'PrivacyInfo.xcprivacy' }
            file_ref = group.new_file('PrivacyInfo.xcprivacy')
            target.resources_build_phase.add_file_reference(file_ref)
            puts 'App PrivacyInfo.xcprivacy added to Xcode project'
          else
            puts 'App PrivacyInfo.xcprivacy already in Xcode project'
          end
          project.save
          RUBY_EOF

      - name: Set build number, privacy strings and export compliance
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Used to take a profile photo for staff members'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Used to take a profile photo for staff members'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Used to select a profile photo for staff members'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Used to select a profile photo for staff members'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Required by the app framework'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'Required by the app framework'" "$PLIST"

      - name: Set up code signing profiles
        script: xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist export_options.plist

      - name: Publish to TestFlight
        script: |
          python3 << 'PYEOF'
          import os, re
          key = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '')
          body = re.sub(r'-----[^-]+-----', '', key)
          body = re.sub(r'\s+', '', body)
          lines = [body[i:i+64] for i in range(0, len(body), 64)]
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(lines) + '\n-----END PRIVATE KEY-----\n'
          with open('/tmp/asc_key.p8', 'w') as f:
              f.write(pem)
          print(f'Key written: {len(body)} base64 chars, {len(lines)} lines')
          PYEOF
          app-store-connect publish \
            --path build/ios/ipa/*.ipa \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @file:/tmp/asc_key.p8

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
