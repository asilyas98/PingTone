workflows:
  dental-signal-ios:
    name: Dental Signal iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dentalsignal.app
      node: 18.17.0
      groups:
        - ios-signing
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App

    scripts:
      - name: Install npm dependencies
        # Delete lock file so npm resolves latest ^5.x versions of Capacitor
        script: |
          rm -f package-lock.json
          npm install

      - name: Install Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Add iOS platform
        script: npx cap add ios

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Patch Podfile with framework privacy manifest hook
        script: |
          # Append a post_install hook to the Podfile (generated by cap sync).
          # The hook writes PrivacyInfo.xcprivacy into the Capacitor and CordovaPlugins
          # pod directories and registers them as bundle resources so Xcode embeds them
          # inside Capacitor.framework and Cordova.framework — fixing ITMS-91061.
          python3 << 'PYEOF'
          ruby_lines = [
              '',
              'post_install do |installer|',
              '  require "fileutils"',
              '  xml  = "<?xml version=\\"1.0\\" encoding=\\"UTF-8\\"?>\\n"',
              '  xml += "<!DOCTYPE plist PUBLIC \\"-//Apple//DTD PLIST 1.0//EN\\"'
              ' \\"http://www.apple.com/DTDs/PropertyList-1.0.dtd\\">\\n"',
              '  xml += "<plist version=\\"1.0\\">\\n<dict>\\n"',
              '  xml += "  <key>NSPrivacyAccessedAPITypes</key>\\n  <array>\\n    <dict>\\n"',
              '  xml += "      <key>NSPrivacyAccessedAPIType</key>\\n"',
              '  xml += "      <string>NSPrivacyAccessedAPICategoryUserDefaults</string>\\n"',
              '  xml += "      <key>NSPrivacyAccessedAPITypeReasons</key>\\n"',
              '  xml += "      <array>\\n        <string>CA92.1</string>\\n      </array>\\n"',
              '  xml += "    </dict>\\n  </array>\\n"',
              '  xml += "  <key>NSPrivacyCollectedDataTypes</key>\\n  <array/>\\n"',
              '  xml += "  <key>NSPrivacyTracking</key>\\n  <false/>\\n"',
              '  xml += "  <key>NSPrivacyTrackingDomains</key>\\n  <array/>\\n"',
              '  xml += "</dict>\\n</plist>\\n"',
              '  installer.pods_project.targets.each do |target|',
              '    next unless ["Capacitor", "CordovaPlugins"].include?(target.name)',
              '    pod_name = target.name',
              '    pod_dir  = installer.sandbox.pod_dir(pod_name).to_s',
              '    FileUtils.mkdir_p(pod_dir)',
              '    privacy_path = File.join(pod_dir, "PrivacyInfo.xcprivacy")',
              '    File.write(privacy_path, xml)',
              '    puts "Written: #{privacy_path}"',
              '    refs = target.resources_build_phase.files_references',
              '    unless refs.any? { |f| f.path.to_s.include?("PrivacyInfo") }',
              '      file_ref = installer.pods_project.new_file(privacy_path)',
              '      target.resources_build_phase.add_file_reference(file_ref)',
              '      puts "Registered in #{target.name} resources build phase"',
              '    end',
              '  end',
              '  installer.pods_project.save',
              'end',
          ]
          with open('ios/App/Podfile', 'a') as f:
              f.write('\n'.join(ruby_lines) + '\n')
          print('Podfile patched with post_install hook')
          PYEOF

      - name: Install CocoaPods
        script: cd ios/App && pod install

      - name: Add app-level Privacy Manifest
        script: |
          # Writes PrivacyInfo.xcprivacy for the app target itself (NSUserDefaults via WKWebView)
          python3 << 'PYEOF'
          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
              '<plist version="1.0">',
              '<dict>',
              '    <key>NSPrivacyAccessedAPITypes</key>',
              '    <array>',
              '        <dict>',
              '            <key>NSPrivacyAccessedAPIType</key>',
              '            <string>NSPrivacyAccessedAPICategoryUserDefaults</string>',
              '            <key>NSPrivacyAccessedAPITypeReasons</key>',
              '            <array>',
              '                <string>CA92.1</string>',
              '            </array>',
              '        </dict>',
              '    </array>',
              '    <key>NSPrivacyCollectedDataTypes</key>',
              '    <array/>',
              '    <key>NSPrivacyTracking</key>',
              '    <false/>',
              '    <key>NSPrivacyTrackingDomains</key>',
              '    <array/>',
              '</dict>',
              '</plist>',
          ]
          with open('ios/App/App/PrivacyInfo.xcprivacy', 'w') as f:
              f.write('\n'.join(lines) + '\n')
          print('App PrivacyInfo.xcprivacy written')
          PYEOF
          ruby << 'RUBY_EOF'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.first
          group = project.main_group['App']
          unless group.files.any? { |f| f.path == 'PrivacyInfo.xcprivacy' }
            file_ref = group.new_file('PrivacyInfo.xcprivacy')
            target.resources_build_phase.add_file_reference(file_ref)
            puts 'App PrivacyInfo.xcprivacy added to Xcode project'
          else
            puts 'App PrivacyInfo.xcprivacy already in Xcode project'
          end
          project.save
          RUBY_EOF

      - name: Set build number, privacy strings and export compliance
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Used to take a profile photo for staff members'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Used to take a profile photo for staff members'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Used to select a profile photo for staff members'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Used to select a profile photo for staff members'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Required by the app framework'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'Required by the app framework'" "$PLIST"

      - name: Set up code signing profiles
        script: xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist export_options.plist

      - name: Publish to TestFlight
        script: |
          python3 << 'PYEOF'
          import os, re
          key = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '')
          body = re.sub(r'-----[^-]+-----', '', key)
          body = re.sub(r'\s+', '', body)
          lines = [body[i:i+64] for i in range(0, len(body), 64)]
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(lines) + '\n-----END PRIVATE KEY-----\n'
          with open('/tmp/asc_key.p8', 'w') as f:
              f.write(pem)
          print(f'Key written: {len(body)} base64 chars, {len(lines)} lines')
          PYEOF
          app-store-connect publish \
            --path build/ios/ipa/*.ipa \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @file:/tmp/asc_key.p8

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
