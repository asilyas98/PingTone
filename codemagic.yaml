workflows:
  dental-signal-ios:
    name: Dental Signal iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dentalsignal.app
      vars:
        APP_ID: com.dentalsignal.app
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 18.17.0

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Install Capacitor CLI globally
        script: |
          npm install -g @capacitor/cli

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Set build number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_ID") + 1))
          xcrun agvtool new-version -all $BUILD_NUMBER
        working_directory: ios/App

      - name: Build iOS for App Store
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: Codemagic
        submit_to_testflight: true
        submit_to_app_store: false
